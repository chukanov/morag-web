# Пример конфига BFF. Рабочий файл — app/config.yml (в git не попадает).
# Любое поле переопределяется переменной окружения: MORAG_WEB_ENGINE__API_KEY и т.п.
# Относительные пути (corpora[].dir, journal.path, auth.data_dir, rate_limit.state_path)
# считаются ОТ КАТАЛОГА ФАЙЛА, в котором записаны: конфиг корпуса может лежать в другом
# репозитории, чем код сайта (MORAG_WEB_CONFIG=…/app/config.yml). MORAG_WEB_CORPUS=<каталог> —
# короткий способ указать корпус вместо списка corpora.
server:
  host: 127.0.0.1
  port: 8080
  # Статика фронта. Сейчас и в проде её отдаёт сам BFF (apache на сервере лишь проксирует);
  # если однажды статику заберёт обратный прокси — поставить null.
  web_root: ../web
  # Сколько прокси перед нами (для честного разбора X-Forwarded-For).
  trusted_proxy_hops: 0

# ⚠️ Здесь стоит ДЕМО-корпус, и это не заглушка, а граница.
# `app/` и `web/` однажды переедут в отдельный репозиторий веб-морды, который будут наполнять
# другие люди другими записями. Пример конфига, знающий про рабочий корпус, — это заточка,
# которую никто не замечает: приложение «работает», потому что данные лежат рядом.
# Рабочий корпус подключается в `app/config.yml` (он вне git) и там же живут адреса и ключи.
corpora:
  - dir: ../corpora/demo
default_corpus: demo

engine:
  # morag pipelines. Локальный дефолт ключа не секрет.
  base_url: http://127.0.0.1:9099
  model: morag
  api_key: "0p3n-w3bu!"
  timeout:
    connect: 10
    # Агент ищет 10-40 с — это пауза между кадрами, а не общий лимит.
    read: 180
    write: 10
    pool: 10

# Свой движок у пространства: `engines[слаг]` перекрывает общий `engine` выше. Нужен там, где
# корпус разложен на пространства: один процесс морага обслуживает ровно один конфиг и одну пару
# коллекций, маршрутизации по запросу в движке нет.
# ⚠️ Мержа поверх `engine` нет — запись берётся целиком, поэтому поля перечисляем все.
# ⚠️ `model` = `PIPELINE_NAME` контейнера, иначе 404.
# `record` — вторая дверь ТОГО ЖЕ корпуса: процесс морага для вопроса про ОДНУ запись (тот же
# индекс, свой промпт без «доищи по всей базе», см. deploy/docker-compose.yml
# `pipelines-<слаг>-record`). Не задана — вопрос к записи идёт в общий движок.
# engines:
#   demo:
#     base_url: "http://127.0.0.1:9101"
#     model: "demo"
#     api_key: "0p3n-w3bu!"
#     timeout: {connect: 10, read: 180, write: 10, pool: 10}
#     record: {base_url: "http://127.0.0.1:9104", model: "demo-record", api_key: "0p3n-w3bu!"}

topic:
  # Авто-тема сессии: один дешёвый вызов LLM после первого ответа.
  # ⚠️ Контур корпоративный: адрес и модель — свои, дефолта тут быть не может.
  # Тот же эндпоинт, что у транскрибации (см. CLAUDE.md).
  enabled: true
  base_url: ""
  model: ""
  # Свой ключ можно не заводить — возьмём из morag-config.yml корпуса.
  api_key: ""
  borrow_key_from_corpus: true
  # Наружу не ходим, прокси не нужен. Поле — про сеть, а не про домен.
  proxy: null
  timeout: 12

limits:
  # Ключ движка общий, агентский цикл платный — держим потолок.
  # Сразу отказ (503), а не очередь: посетитель не должен смотреть в пустоту.
  #
  # Пять, а не два: ответ идёт 50-190 секунд, и при двух слотах третий пришедший
  # в ту же минуту гарантированно получал отказ. Замерено на подкасте 2026-08-18,
  # когда на сайт впервые пришли живые люди: четыре 503 за утро, один человек
  # упёрся в отказ ТРИЖДЫ за 23 секунды, прежде чем прошёл.
  # ⓘ Число стоит перемерить на своём эндпоинте: там своя пропускная способность,
  # и упирается всё в неё, а не в нас.
  max_concurrent_streams: 5
  history_turns: 6
  question_max_chars: 1000
  history_max_chars: 12000

  # Rate-limit по адресу. В корпоративном контуре кошелёк не при чём — бережём
  # эндпоинт: он общий на компанию, и десять вкладок одного человека не должны
  # занимать его целиком. Ограничивается только /api/ask; статика, список записей
  # и читалка бесплатны, лимит там только вредил бы.
  rate_limit:
    # Рубильник: false — лимитов нет вовсе. Отдельный рубеж снимается нулём.
    enabled: true
    # Ведро: burst доступно сразу, дальше по одному вопросу за refill_seconds.
    # Ведро, а не «N в час»: живой человек задаёт три вопроса подряд и уходит —
    # такой всплеск переживаем, а равномерный долбёж скриптом душим.
    burst: 5
    refill_seconds: 120
    # Одновременных вопросов с одного адреса (0 — не ограничивать).
    per_ip_concurrent: 1
    # Потолок на весь сайт в сутки (0 — без потолка). У подкаста он считался в
    # деньгах OpenRouter; здесь денег нет, поэтому по умолчанию снят — поставьте
    # число, когда станет известна квота корпоративного эндпоинта.
    daily_total: 0
    # Дневной счётчик переживает перезапуск, вёдра — нет (им незачем).
    state_path: ./data/ratelimit.json
    # Ключ для IPv6 — сеть, а не адрес: клиенту выдают целую подсеть,
    # и лимит на адрес обходится бесплатно, взяв соседний.
    ipv6_prefix: 64

journal:
  # Приватный журнал владельца: материал для разбора провалов. Не в git.
  # ⚠️ Здесь это ещё и персональные данные сотрудников (кто что спрашивал):
  # в корпоративном контуре к журналу относимся строже, чем к чужому кошельку.
  path: ./data/journal.jsonl
  enabled: true

# Загрузка записи, транскрибированной на чужой машине (`tools/ingest.py` → `/api/ingest`):
# пока нет сервера с моделями, докладчик гонит стек у себя и загружает пакет, а сервер доводит
# его до записи тем же `make_record` (настоящие словари, раскладка) и запускает индексацию.
# Выключено по умолчанию; включённое — право `ingest` (любой вошедший), без входа — только петля.
ingest:
  enabled: false
  # dir: ../corpora/demo/incoming       # стейджинг; пусто — <семья>/incoming (вне records/ — индексатор не видит)
  # archive: /srv/archive               # корень архива видео (то, что раздаёт media_base); пусто — видео не переносится
  video_dir: Uploads                    # подкаталог в архиве под загруженные видео → media: Uploads/<id>.mp4
  max_gb: 12                            # потолок одного файла
  min_free_gb: 10                       # меньше свободно на диске стейджинга — 507
  # ⚠️ У чужой машины свой реестр голосов, и её Speaker_N совпали бы с корпусными: номера
  # сдвигаются в отдельный диапазон, запись живёт с безымянными голосами до правки на сайте.
  speaker_base: 100000
  speaker_step: 1000
  # Команды — argv с подстановками {artifact} {record_dir} {family}; сборка получает флаги сама.
  # build: [python3, tools/make_record.py]
  # after: [[python3, tools/make_cover.py, "{record_dir}"], [python3, tools/voices.py, --scan]]
  # index: [docker, compose, -f, ../corpora/example/../../deploy/docker-compose.yml, --profile, tools, run, --rm, indexer, index]

auth:
  # Вход на сайт: форма + cookie. Выключено — сайт анонимный, как подкаст, и правка
  # держится рубежами `editing` (флаг, отказ сервера, только петля).
  # Включено — всё, кроме формы входа и статики, требует сессии; API без сессии отвечает
  # 401 JSON, страницы уводят на /signin. Почему не Basic Auth на прокси: прокси-помощники
  # у коллег отвечают на любой 401-челлендж паролем от прокси и ломают вход.
  enabled: false
  # Ключ подписи cookie. Пусто — генерируется при первом старте в data_dir/secret (0600):
  # каталог вне git и вне доставки, у каждой машины ключ свой.
  secret: ""
  session_days: 14
  cookie_name: morag_session
  # `Secure` у cookie: null — по факту (https или X-Forwarded-Proto от ДОВЕРЕННОГО прокси,
  # см. server.trusted_proxy_hops); true/false — принудительно.
  cookie_secure: null
  # Снимки учёток вошедших (имя, должность, отдел, группы, фото) и ключ. Персональные
  # данные — как журнал: не в git, не в доставке. Удалить снимок = разлогинить человека.
  data_dir: ./data/auth
  # Каталог AD/LDAP. Без сервисной учётки: человек связывается с каталогом сам — логин по
  # шаблону bind_template, контроллер сверяет пароль, той же связью читается его запись.
  # На сервере ничего, чем можно войти, не хранится. Адрес, base DN и шаблон — в рабочем
  # config.yml (вне git) или в env: MORAG_WEB_AUTH__LDAP__URL, …__BASE_DN, …__BIND_TEMPLATE.
  # Сервисная учётка (bind_dn/bind_password) — запасной ход, если домен не даёт сотруднику
  # читать собственные группы; такая учётка читает весь каталог — просить минимальную.
  ldap:
    url: ""                       # ldaps://dc.example.org:636 (или ldap://…:389)
    base_dn: ""                   # dc=example,dc=org
    bind_template: ""             # "{login}@example.org" или "EXAMPLE\\{login}"
    bind_dn: ""                   # только для search-then-bind: cn=svc-site,ou=service,dc=example,dc=org
    bind_password: ""
    login_attribute: sAMAccountName
    attributes: [displayName, mail, title, department, memberOf, thumbnailPhoto]
    # Разовая отладка: писать в снимок всю запись каталога, чтобы увидеть, что есть по учётке.
    keep_raw_entry: false
    ca_file: ""                   # корпоративный корень для ldaps, если системного мало
    verify_tls: true
    timeout: 5
  # Пользователи вне каталога: демо, гость, локальная разработка. Пароль — только хэшем,
  # его печатает `python3 tools/auth_password.py <логин>`.
  users: []
  #  - login: kuznetsova
  #    name: Мария Кузнецова
  #    password: "scrypt$16384$8$1$…$…"
  #    role: admin
  # Роли: viewer < editor < admin. Реплики правит editor, имена голосов и правила словаря —
  # admin. Роль считается на каждый запрос: сменили конфиг — не нужно перелогиниваться.
  roles:
    default: editor
    by_group: {}                  # "CN=site-admins,OU=groups,DC=example,DC=org": admin
    by_user: {}                   # kuznetsova: admin
  # Кому сайт открыт вообще: маски групп каталога (CN или DN, без регистра, * и ? как в shell).
  # Доменный пользователь без такой группы не входит (403 с message) и вылетает на первом же
  # запросе, если правило ужесточили позже. Пусто — любой вошедший. Локальные пользователи
  # проходят всегда.
  access:
    groups: []                    # ["*_site-users", "CN=site-admins,OU=groups,DC=example,DC=org"]
    users: []                     # поимённо, поверх масок: ["kuznetsova"] — сайт открыт и без группы
    message: "нет доступа к сайту"
  # Лимит попыток входа — прежде всего от блокировки доменной учётки повторными неверными
  # bind'ами: порог в политике домена обычно 5-10, держим ниже.
  login_limit:
    attempts: 4
    window_seconds: 900
    per_ip_attempts: 30
