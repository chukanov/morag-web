# Контрольные вопросы — ПРИМЕР формата. На них меряется качество после каждой правки промпта:
#   python3 tools/ask_probe.py --probes corpora/<семья>/spaces/<слаг>/probes.yml
# Набор — не «интересные вопросы», а ПОКРЫТИЕ КЛАССОВ ошибок: каждый вопрос ловит свой способ
# ошибиться. `ждём` — не эталонный ответ (его нет), а на что смотреть глазами при разборе.
# ⚠️ Двоеточие внутри значения — только в кавычках, иначе YAML невалиден.
probes:
- вопрос: Какие были доклады про Kafka?
  класс: каталог-перечень
  ждём: идёт в catalog, а не в search; перечисляет с датами; не выдумывает несуществующих
- вопрос: Почему для очереди задач выбрали Postgres, а не Redis?
  класс: точечный технический
  ждём: существо решения и причина, числа если назывались, ссылки [N] на секунды
- вопрос: Что спросили из зала после доклада про индексы?
  класс: вопросы из зала
  ждём: отдельный search по репликам зала; без «Speaker_N» в ответе
- вопрос: Что рассказывали про машину времени в 2019 году?
  класс: отрицательный
  ждём: честное «в записях этого не звучало», без выдумок
