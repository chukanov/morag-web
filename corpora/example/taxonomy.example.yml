# Таксономия записей — ПРИМЕР. Классификатор (`tools/classify.py`) читает `taxonomy.yml` семьи
# корпуса и ставит записи одну категорию (предмет) и темы из словаря; незнакомая тема уезжает в
# отчёт, а не в шапку. Таксономия — это и есть промпт: определения категорий с «НЕ про …» —
# то, чем правят разметку.
categories:
  - name: "Инфраструктура"
    about: "Кластеры, деплой, мониторинг, сети. НЕ про данные: хранилища и потоки — в «Данные»."
  - name: "Данные"
    about: "Хранилища, потоки, ETL, форматы. НЕ про инструменты разработки."
  - name: "Разработка"
    about: "Языки, архитектура сервисов, библиотеки, практики."
  - name: "Организация и процессы"
    about: "Как работаем: планирование, итоги, ретроспективы."
topics:
  системы:
    - {name: "Биллинг", aliases: ["billing", "билинг"]}
  технологии:
    - {name: "Kafka", aliases: ["кафка", "Kafka Streams"]}
    - {name: "Postgres", aliases: ["PostgreSQL", "постгрес", "постгрез"]}
    - {name: "Kubernetes", aliases: ["k8s", "кубер"]}
