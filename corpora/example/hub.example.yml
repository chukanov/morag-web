# Витрина корпуса — ПРИМЕР. Витрина нужна, когда пространств несколько или когда правила
# раскладки записей хочется держать в одном файле. Один корпус из одного пространства может
# обойтись `site.yml` (см. `corpora/demo`): тогда витрина вырождается в переход внутрь.
#
# Витрина = бренд сайта целиком + порядок пространств + правила раскладки (куда положить НОВУЮ
# запись) + модели ролей по веткам. Секретов и адресов здесь нет: они в `app/config.yml`.

brand:
  title: "Записи встреч"
  tagline: "Доклады, собрания и курсы с расшифровкой — {записей}"
  about: |
    <p>Записи внутренних встреч и учебных курсов с расшифровкой и поиском по смыслу.</p>
  # Картинки бренда — файлы в brand/ рядом с этим файлом: обложка лендинга и значок вкладки.
  # cover: cover.png
  # favicon: favicon.png
  # Знак в шапке: рисунок ASCII файлом (brand/mark.txt) и слово рамочным шрифтом. Без рисунка —
  # только слово; без слова — слово платформы (MORAG). Клетки мордочки (mark_face) — по желанию:
  # глаз моргает, кончик морды нюхает, пятачок раздувается; адреса — строка/колонки с нуля.
  # mark: mark.txt
  # wordmark: TALKS
  # mark_face:
  #   eye: {row: 1, from: 37, to: 39, open: "__", shut: "  "}
  #   nose: {row: 1, from: 42, to: 47}
  #   snout: {row: 2, col: 46, calm: "p", sniff: "O"}

theme:
  mood: instrument
  tokens:
    accent: "#3F7FB5"
    accent-fill: "#3F7FB5"
    sonar: "#57B4A9"
  fonts: {display: "PT Serif", data: "PT Mono"}

# Пространства — самостоятельные сайты: свой каталог записей (он же `sources[].path`
# индексатора), свой процесс движка, свой префикс в адресе. Порядок здесь — порядок карточек.
spaces:
  - slug: talks
    dir: spaces/talks

# Куда класть НОВУЮ запись. Единственная копия этого знания: сайт правил не читает — раздел
# списка это каталог на диске (`records/<ветка>/<второй уровень>/<id>/`). Ключи `match`
# соединяются ИЛИ; первое совпавшее правило выигрывает. `branch` — ветка (каталог первого
# уровня), `sub` — второй уровень буквально (у курса — сам курс; без `sub` — год из даты).
routing:
  - match: {tag: "Концерт", event_prefix: "Концерт"}
    space: talks
    branch: "Встречи"
  - match: {event_prefix: "Курс"}
    space: talks
    branch: "Курсы"
    sub: "Python 2024"
  - match: {event: "Собрание команды"}
    space: talks
    branch: "Встречи"
  - match: {rest: true}
    space: talks
    branch: "Доклады"

# Кто в записи докладчик: `talk` — по календарю/мете, иначе самый долгий названный голос при
# доле эфира ≥ 40 %; `course` — лектор = самый долгий голос; `meeting` — все в участниках.
roles:
  "Доклады": {model: talk}
  "Курсы": {model: course}
  "Встречи": {model: meeting}
