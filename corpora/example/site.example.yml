# Пространство — ПРИМЕР (см. также `corpora/demo/site.yml`, на котором идут тесты).
slug: talks

brand:
  # Заголовок вкладки, форма входа, OG-превью.
  title: "Доклады"
  tagline: "Спросите про любую из {записей-род}"
  about: |
    <p>Еженедельные доклады и демо с расшифровкой. Кликните по слову — запись включится с этого места.</p>
  links: []
  # Примеры вопросов под полем на главной — запасные, пока в корпусе нет записей.
  examples:
    - "Что рассказывали про Kafka?"
    - "Кто выступал в 2024 году?"

theme:
  mood: instrument
  tokens:
    accent: "#3F7FB5"
    accent-fill: "#3F7FB5"
    sonar: "#57B4A9"
  # Перелив знака и заставки темы: узор, палитра, цель, период. `random` — каждый раз свои;
  # повтор в пуле целей — вес. Заливка (ink) в пул не идёт: съедает буквы.
  halo: {pattern: random, palette: aurora, target: random, targets: [glyph, glyph, glyph, halo], period: 1.5}
  fonts: {display: "PT Serif", data: "PT Mono"}
  # Цвет ветки (каталога первого уровня под records/): фронт маркирует им записи везде.
  sections:
    "Доклады": "#3F7FB5"
    "Встречи": "#3FA66B"
    "Курсы": "#2BB3A8"

content:
  records: records
  group_by: event
  # Свежее сверху; у КУРСА — наоборот: лекции читают подряд (по умолчанию при фильтре по ветке).
  order: desc
  section_order: {"Курсы": asc}

chat:
  enabled: true
  # Вопрос из читалки по клику на реплику: что уходит агенту вокруг вопроса.
  ask_from_line:
    window: 2
    context_max_chars: 2500
    template: |
      Вопрос задан во время просмотра записи «{title}» ({group}, {date}) на отметке {mmss}.
      Реплика, о которой спрашивают ({speaker}): «{quote}»

      Контекст вокруг:
      {context}

      Вопрос: {question}
  # Вопрос к ОДНОЙ записи: идентификатор — В КАВЫЧКАХ (в пути бывают пробелы).
  ask_about_record:
    template: |
      Вопрос — про ОДНУ запись: «{title}» ({group}, {date}).
      {doc_ref}
      Ищи только в ней; нет в ней — так и скажи.

      Вопрос: {question}
    doc_ref: 'Идентификатор записи: "{doc_id}" — он получен от системы, не выдуман; передавай ДОСЛОВНО: search(query, doc_ids=["{doc_id}"]), get_doc("{doc_id}", query).'
  # Кнопки-пресеты над расшифровкой: ключ — ветка, `*` — общие; своя строка ЗАМЕНЯЕТ общую.
  presets:
    "*":
      - {label: "Краткое содержание", question: "Перескажи эту запись: о чём она и что в ней главное."}
      - {label: "Главные тезисы", question: "Назови главные тезисы этой записи по порядку, с моментами."}
    "Встречи":
      - {label: "Резюме встречи", question: "Кратко: что обсуждали и что решили."}
      - {label: "Открытые вопросы", question: "Какие вопросы остались открытыми и за кем они?"}
